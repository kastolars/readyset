name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Go that go.mod allows, and the latest release.
        go: ['1.23', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      # -coverpkg also counts the shared set-law checks, which other packages' tests run.
      - run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Report coverage
        if: matrix.go == 'stable'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
          format: golang
          fail-on-error: false # a coverage service outage must not fail the build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
